# Mosquitto 2.x broker for the rover's own VDA 5050 traffic (ROVER_VDA5050_LOCAL_BROKER=true).
#
# For development, simulation and a master control on the same LAN. A production fleet usually
# runs its own broker: point ROVER_VDA5050_BROKER_HOST at it and disable this one, or bridge the
# two (a `connection` block here).
#
# Anonymous and unencrypted: acceptable only on a trusted LAN. Set a password_file (and TLS
# listeners) before exposing it further.

per_listener_settings false
allow_anonymous true

# MQTT, for the connector and master control.
listener 1883

# MQTT over WebSockets, for browser tools such as vda5050_visualizer.
listener 9001
protocol websockets

# Retained messages (connection, factsheet) are kept in memory only: a restarted broker starts
# empty and the connector re-publishes them on reconnect.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
